custom:
  # Etherlink mainnet runs a Michelson runtime alongside the EVM one, so EVM↔tz aliases exist and the
  # RuntimeGateway `originOf` precompile is authoritative. `custom` merges first-level only, so this
  # block replaces the base one (dipdup.yaml) — restate here any key added there later.
  # With `true` every EVM deposit/withdrawal handler resolves its account through the precompile; if
  # the precompile is absent the call raises RuntimeGatewayUnsupportedError, which takes L1 indexing
  # down with it. Must be a literal YAML bool: handlers/alias.py requires `isinstance(value, bool)`,
  # and env substitution can only ever yield a string.
  has_michelson_runtime: true

datasources:
  # DipDup merges -c files with a shallow top-level dict.update, so this block REPLACES the base
  # `datasources` wholesale — every base datasource is restated verbatim below. Losing one is silent
  # at boot; dropping `etherlink_subsquid` alone would break the five EVM indexes that list it.
  tzkt:
    kind: tezos.tzkt
    url: ${TZKT_URL}

  metadata:
    kind: tzip_metadata
    # ${NETWORK} is the compose config selector (= mainnet) and also the name the dipdup metadata
    # service indexes this L1 under, so the base value is correct here as-is.
    network: ${NETWORK}
    url: ${METADATA_URL}

  tezos_node:
    kind: http
    url: ${TEZOS_NODE_URL}

  etherlink_node:
    kind: evm.node
    url: ${ETHERLINK_NODE_URL}
    # Mirrored from the base config, where the full rationale lives: `ws_url` carries the node's
    # websocket path for realtime heads (and the duplicate-head patch that goes with it), `http` is
    # the client-side ratelimit — without it `ratelimit_rate` defaults to 0, i.e. no throttling.
    ws_url: ${ETHERLINK_NODE_WS:-~}
    http:
      batch_size: 100
      ratelimit_rate: 900
      ratelimit_period: 60
      ratelimit_sleep: 10

  etherlink_subsquid:
    kind: evm.subsquid
    url: ${ETHERLINK_SUBSQUID_URL:-~}
    api_key: ${SUBSQUID_API_KEY:-}

  rollup_node:
    kind: http
    url: ${ROLLUP_NODE_URL}
    http:
      retry_count: 2
      retry_sleep: 1.0
      retry_multiplier: 1.0
      connection_timeout: 1
      request_timeout: 4

  # L2 Michelson side of the rollup — a TzKT over the rollup's Michelson runtime. Base host only,
  # DipDup appends `/v1` itself. Unreachable at boot is a crash loop, not degradation:
  # TezosTzktDatasource.__aenter__ probes v1/protocols/current and raises DatasourceError before the
  # database schema is even opened.
  tezos_x_michelson_tzkt:
    kind: tezos.tzkt
    url: ${TEZOSX_MICHELSON_TZKT_URL}

contracts:
  tezos_smart_rollup:
    kind: tezos
    address: ${SMART_ROLLUP_ADDRESS}
    typename: rollup

  tezos_fast_withdrawal_native:
    kind: tezos
    address: ${FAST_WITHDRAWAL_NATIVE_ADDRESS}
    typename: fast_withdrawal

  # TEZLINK_DEPOSITOR — synthetic source of L1->L2 Michelson XTZ deposits: the kernel
  # const [0u8; 22] (all-zero serialized implicit contract) rendered in base58. A kernel
  # constant, not a deployment address — identical on every network.
  # See handlers/michelson_deposit.py for the kernel citations.
  tezos_x_michelson_depositor:
    kind: tezos
    address: tz1Ke2h7sDdakHJQh8WX4Z372du1KChsksyU

  etherlink_rollup_kernel:
    kind: evm
    address: '0x0000000000000000000000000000000000000000'
    typename: kernel

  etherlink_rollup_kernel_native:
    kind: evm
    address: '0x0000000000000000000000000000000000000000'
    typename: kernel_native

  etherlink_deposit_sender:
    kind: evm
    # FEED_DEPOSIT_ADDR — synthetic `from` of all deposit-injection txs in the new kernel
    address: '0x000000000000000000000000000000000000feed'
    typename: kernel

  l2_withdrawal_precompile_fa:
    kind: evm
    address: '0xff00000000000000000000000000000000000002'
    typename: kernel

  l2_withdrawal_precompile_native:
    kind: evm
    address: '0xff00000000000000000000000000000000000001'
    typename: kernel_native

  l2_pepe_token:
    kind: evm
    address: '0x9121b153bbcf8c23f20ee43b494f08760b91ad64'
    typename: l2_token
  l2_ottez_token:
    kind: evm
    address: '0x8322723f5ca51cb20a80d6c55d24eaa1651f68c7'
    typename: l2_token
  l2_wine_token:
    kind: evm
    address: '0xbfc8d679893ec19c4e658fb2f3cf08e3497620f9'
    typename: l2_token
  l2_catami_token:
    kind: evm
    address: '0x0d48d8079631068e95d8cff1ed62e9302404fbac'
    typename: l2_token
  l2_stxtz_token:
    kind: evm
    address: '0x01f07f4d78d47a64f4c3b2b65f513f15be6e1854'
    typename: l2_token
  l2_lyzi_token:
    kind: evm
    address: '0x19418d0af0f36865cdfbb2437dfed29ba34d3190'
    typename: l2_token
  l2_tkey_token:
    kind: evm
    address: '0x790c6fcc916db20ab180d3d3666d51a6662a1a3c'
    typename: l2_token
  l2_usdtz_token:
    kind: evm
    address: '0x5b456255fc3389a1ed284a74be0d1f38734d3d6a'
    typename: l2_token
  l2_btctz_token:
    kind: evm
    address: '0x8fb3f935eb6d1f15ce6b3a1034b52a6ed19d4f45'
    typename: l2_token
  l2_ethtz_token:
    kind: evm
    address: '0x15995a651e82899e65aecf9fa66930722985718a'
    typename: l2_token
  l2_fusdtz_token:
    kind: evm
    address: '0x8039b230094289564398e19a0612c8fec114b451'
    typename: l2_token
  l2_fusdt_token:
    kind: evm
    address: '0x57dda16a2160bb227f72c3b14f7de272d526a8f5'
    typename: l2_token

indexes:
  tezos_head:
    kind: tezos.head
    datasources:
      - tzkt
    callback: tezos.on_head

  tezos_rollup_cement:
    kind: tezos.operations
    first_level: ${L1_FIRST_LEVEL}
    datasources:
      - tzkt
    types:
      - sr_cement
    contracts:
      - tezos_smart_rollup
    handlers:
      - callback: tezos.on_cement_commitment
        pattern:
          - type: sr_cement
            destination: tezos_smart_rollup


  tezos_deposit_operations:
    kind: tezos.operations
    first_level: ${L1_FIRST_LEVEL}
    datasources:
      - tzkt
    types:
      - transaction
    contracts:
      - tezos_smart_rollup
    handlers:
      - callback: tezos.on_rollup_call
        pattern:
          - type: transaction
            destination: tezos_smart_rollup
            entrypoint: default


  tezos_claim_fast_withdrawal_operations:
    kind: tezos.operations
    first_level: ${L1_FIRST_LEVEL}
    datasources:
      - tzkt
    types:
      - transaction
    contracts:
      - tezos_fast_withdrawal_native
    handlers:
      - callback: tezos.on_claim_xtz_fast_withdrawal
        pattern:
          - type: transaction
            destination: tezos_fast_withdrawal_native
            entrypoint: payout_withdrawal

  etherlink_deposit_events:
    kind: evm.events
    first_level: ${L2_FIRST_LEVEL}
    datasources:
      - etherlink_subsquid
      - etherlink_node
    handlers:
      - callback: etherlink.on_deposit
        # NOTE: legacy event emit address
        contract: etherlink_rollup_kernel
        name: Deposit
      - callback: etherlink.on_deposit
        contract: l2_withdrawal_precompile_fa
        name: Deposit

  etherlink_xtz_deposit_transactions:
    kind: evm.transactions
    first_level: ${L2_FIRST_LEVEL}
    datasources:
      - etherlink_subsquid
      - etherlink_node
    handlers:
      # NOTE: legacy transaction sender address
      - callback: etherlink.on_xtz_deposit
        from_: etherlink_rollup_kernel
      - callback: etherlink.on_xtz_deposit
        from_: etherlink_deposit_sender


  # L2 Michelson XTZ deposits (tz1 receiver): synthetic pseudo-transactions emitted by the kernel from
  # TEZLINK_DEPOSITOR, matched to the L1 leg by reconstructed op-hash
  # (BridgeMatcher.check_pending_michelson_deposits, derivation in handlers/michelson_deposit.py).
  # L2_MICHELSON_FIRST_LEVEL is an Etherlink L2 block number — the Michelson runtime shares the EVM
  # block counter — and must be the first level that runtime exists at: earlier synthetic ops use an
  # unverified derivation and would sit unmatched forever, and an unset value backfills from genesis.
  # Above the Michelson TzKT's head at boot it freezes the WHOLE indexer with no error and no log
  # line — the index never leaves status `new`, so no datasource ever opens a websocket.
  # Adding an index leaves every existing index's config hash byte-identical, so this needs no reindex.
  tezos_x_michelson_deposits:
    kind: tezos.operations
    first_level: ${L2_MICHELSON_FIRST_LEVEL}
    datasources:
      - tezos_x_michelson_tzkt
    types:
      - transaction
    contracts:
      - tezos_x_michelson_depositor
    handlers:
      - callback: tezos_x.on_michelson_deposit_ophash
        pattern:
          - type: transaction
            source: tezos_x_michelson_depositor


  etherlink_withdrawal_events:
    kind: evm.events
    first_level: ${L2_FIRST_LEVEL}
    datasources:
      - etherlink_subsquid
      - etherlink_node
    handlers:
      # NOTE: legacy, required for first etherlink levels
      - callback: etherlink.on_withdraw
        contract: etherlink_rollup_kernel
        name: Withdrawal
      # NOTE: legacy, required for first etherlink levels
      - callback: etherlink.on_xtz_withdraw
        contract: etherlink_rollup_kernel_native
        name: Withdrawal
      - callback: etherlink.on_withdraw
        contract: l2_withdrawal_precompile_fa
        name: Withdrawal
      - callback: etherlink.on_xtz_withdraw
        contract: l2_withdrawal_precompile_native
        name: Withdrawal
      - callback: etherlink.on_xtz_withdraw
        contract: l2_withdrawal_precompile_native
        name: FastWithdrawal

  tezos_withdrawal_operations:
    kind: tezos.operations
    first_level: ${L1_FIRST_LEVEL}
    datasources:
      - tzkt
    types:
      - sr_execute
    contracts:
      - tezos_smart_rollup
      - tezos_fast_withdrawal_native
    handlers:
      - callback: tezos.on_rollup_execute
        pattern:
          - type: sr_execute
            destination: tezos_smart_rollup
      - callback: tezos.on_rollup_execute
        pattern:
          - type: sr_execute
            destination: tezos_fast_withdrawal_native


  etherlink_token_balance_update_events:
    kind: evm.events
    datasources:
      - etherlink_subsquid
      - etherlink_node
    handlers:
      - callback: etherlink.on_transfer
        contract: l2_pepe_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_ottez_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_wine_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_catami_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_stxtz_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_lyzi_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_tkey_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_usdtz_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_btctz_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_ethtz_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_fusdtz_token
        name: Transfer
      - callback: etherlink.on_transfer
        contract: l2_fusdt_token
        name: Transfer
