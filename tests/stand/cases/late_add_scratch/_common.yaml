spec_version: 3.0
package: rollup_bridge_indexer

custom:
  has_michelson_runtime: true

database:
  kind: sqlite
  path: ${SQLITE_PATH:-/tmp/bridge_late_add_scratch.sqlite}

datasources:
  tzkt:
    kind: tezos.tzkt
    url: ${TZKT_URL}
  metadata:
    kind: tzip_metadata
    network: ${NETWORK}
    url: ${METADATA_URL}
  tezos_node:
    kind: http
    url: ${TEZOS_NODE_URL}
  rollup_node:
    kind: http
    url: ${ROLLUP_NODE_URL}
    http:
      retry_count: 2
      retry_sleep: 1.0
      retry_multiplier: 1.0
      connection_timeout: 1
      request_timeout: 4
